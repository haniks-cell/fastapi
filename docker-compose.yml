  redis: # Имя сервиса теперь 'redis', как и в depends_on
    image: redis:7.2-alpine
    container_name: redis_container # Также поправим имя контейнера для единообразия
    restart: always
    # ports:
    #   - "6379:6379"
    # volumes:
    #   - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    environment:
      - TZ=Europe/Moscow
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  nginx:
    image: nginx:latest
    # network_mode: "host" # Убираем этот режим, он не работает как ожидается на Windows/macOS
    container_name: nginx_proxy
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./static_json:/var/www/static
      # Пробрасываем шаблон в отдельную директорию внутри контейнера
      - ./static_json/openid-configuration.json.template:/etc/nginx/templates/openid-configuration.json.template:ro
    depends_on:
      - fastapi_app
    restart: unless-stopped
    command: /bin/sh -c "envsubst '$${APPLICATION_URL}' < /etc/nginx/templates/openid-configuration.json.template > /var/www/static/openid-configuration.json && nginx -g 'daemon off;'"

  aiogram_bot:
    build: ./aiogram
    container_name: aiogram_bot
    env_file:
      - ./aiogram/.env
    depends_on:
      - kafka
    restart: unless-stopped
    environment:
      - PROXY_URL=http://host.docker.internal:10808
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep -v grep | grep aiogram_bot.py"]
      interval: 30s
      timeout: 10s
      retries: 5

  email_sender:
    build: ./email_sender
    container_name: email_sender
    env_file:
      - .env # Глобальные переменные (KAFKA_BOOTSTRAP_SERVERS, APPLICATION_URL)
      - ./email_sender/.env # Переменные для почты (GMAIL_LOGIN, GMAIL_PASSWORD и т.д.)
    depends_on:
      - kafka
    restart: unless-stopped
    # environment:
